name: Verificar aplicativo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run test:layout
      - run: npm run test:formats
      - run: npm run dist
      - run: npm run test:release
      - run: npm run test:desktop -- "release/win-unpacked/Bili Studio.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verificacao-windows
          path: |
            data/layout-smoke-*/layout-report.json
            data/layout-smoke-*/history-collapsed.png
            data/format-matrix-report.json
            data/desktop-smoke-*/desktop-smoke.json
            release/SHA256SUMS.txt
          if-no-files-found: ignore
